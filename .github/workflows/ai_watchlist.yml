name: AI Watchlist Earnings Alert

on:
  schedule:
    # All times ET (UTC-4 during EDT, UTC-5 during EST — using EDT here)
    # 8:00 AM ET  = 12:00 UTC — morning brief, pre-market earnings
    - cron: '0 12 * * 1-5'
    # 12:30 PM ET = 16:30 UTC — midday check, catches 11am–noon releases
    - cron: '30 16 * * 1-5'
    # 4:45 PM ET  = 20:45 UTC — after-close check, catches AH earnings (most common)
    - cron: '45 20 * * 1-5'

  workflow_dispatch:   # manual trigger from GitHub mobile app

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI watchlist scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_watchlist_scanner.py
